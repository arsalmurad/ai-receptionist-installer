name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Per Vercel's monorepo docs, the CLI must run from the repo root, not
      # the app subdirectory - the linked project's Root Directory setting
      # (apps/web) tells it where to build. Flow per Vercel's CLI docs
      # (deploying from local build / prebuilt): vercel pull -> vercel build
      # -> vercel deploy --prebuilt.
      - name: Pull Vercel project settings and env vars
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build (prebuilt)
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-workers:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy llm-gateway
        working-directory: workers/llm-gateway
        run: npx wrangler deploy

      - name: Deploy media-gate
        working-directory: workers/media-gate
        run: npx wrangler deploy
